# Source: GitHub starter workflow "Simple workflow" (MIT) — https://github.com/actions/starter-workflows/blob/main/ci/blank.yml
#
# Repaired by repocurator (feature 002): the test job ran only the starter's
# placeholder echo, so a green check proved just that the runner could print
# a sentence. This repository ships a real Node.js test suite
# (test/*.test.cjs, run with `node --test`) and a real shell test suite
# (test/*.test.sh) that exercise the credential helper, the upstream API
# adapter, the attribution trailer, the commit hook, the bootstrap script,
# the status script and install.sh end to end against local fixtures — no
# GitHub network access is needed or used. The push/pull_request trigger
# already named this repository's default branch (`main`), so that part of
# the starter was not drifted.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The workflow token is read-only by default.
# Grant extra permissions to a single job only when that job needs them.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that actions are pinned to full commit SHAs
        shell: bash
        run: |
          # Every `uses:` must reference a full 40-character commit SHA followed by a
          # version comment, for example:
          #   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          # Local actions (./path) and Docker images (docker://) are skipped.
          set -euo pipefail
          unpinned="$(grep -RnE '^[[:space:]]*(-[[:space:]]+)?uses:' .github/workflows \
            | grep -vE "uses:[[:space:]]*['\"]?(\./|docker://)" \
            | grep -vE "@[0-9a-f]{40}['\"]?[[:space:]]+#[[:space:]]*v?[0-9]" || true)"
          if [ -n "$unpinned" ]; then
            echo "::error::Pin these actions to a full-length commit SHA with a version comment:"
            echo "$unpinned"
            exit 1
          fi
          echo "All actions are pinned to full-length commit SHAs."

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Build
        run: node --check lib/attribution.cjs && node --check bin/myanyagent-credential-helper.cjs && node --check bin/myanyagent-upstream.cjs && sh -n install.sh && sh -n bin/myanyagent-bootstrap.sh && sh -n bin/myanyagent-status.sh && sh -n hooks/prepare-commit-msg

      - name: Test
        run: |
          node --test test/helper.test.cjs test/upstream.test.cjs test/attribution.test.cjs
          sh test/hooks.test.sh
          sh test/bootstrap.test.sh
          sh test/status.test.sh
          sh test/install.test.sh
