# MyAnyAgent machine-level configuration
# Installed by install.sh to ~/.config/myanyagent/config.toml
# These values are shared across all repos using the same GitHub App.
#
# !!! ACTION REQUIRED on a fresh install !!!
# Fill in YOUR values below. Where to find them:
#   client_id  -> your GitHub App settings page ("Client ID")
#   app_id     -> same page ("App ID")
#   private_key -> the .pem you generated on that page; an absolute path

client_id = "REPLACE_ME"
app_id = "REPLACE_ME"
private_key = "REPLACE_ME"

# Third-party public-repo contributions (myanyagent-upstream):
# a classic PAT (scope: public_repo) for the HUMAN account lives at
#   ~/.secrets/myanyagent-upstream.pat   (mode 0600, provision separately, never commit)
# Override per-invocation with MYANYAGENT_UPSTREAM_TOKEN env var.
# No secret is ever stored in this file.